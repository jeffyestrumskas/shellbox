# shellbox default config for Hermes Agent (https://hermes-agent.nousresearch.com).
#
# This is a TEMPLATE: the ${...} placeholders are substituted from the
# container's environment by shellbox on first run, then written to
# ~/.hermes/config.yaml in the persistent state mount. shellbox never
# overwrites an already-rendered config, so edits you make (e.g. adding a
# messaging channel) survive across runs. Secrets live in ~/.hermes/.env (see ./env).
#
# Models are served by Ollama Cloud's OpenAI-compatible endpoint; all egress is
# gated by the required --boxwall firewall.

# Custom provider = any OpenAI-compatible server. Here: Ollama Cloud.
model:
  provider: custom
  model: ${OLLAMA_MODEL}
  base_url: ${OLLAMA_BASE_URL}
  # Hermes requires >= 64000 tokens of context for its tool-calling loop.
  context_length: 64000

# Messaging channel: configure a SEPARATE-IDENTITY bot here (recommended:
# Telegram via @BotFather — its own account, so it can't impersonate you or read
# your other chats). Until one is set there is no channel and you drive the agent
# from the box terminal. Example (confirm keys vs Hermes docs):
#
# messaging:
#   telegram:
#     enabled: true
#     bot_token: "${TELEGRAM_BOT_TOKEN}"     # from @BotFather
#     allow_from:
#       - "${TELEGRAM_ALLOW_FROM}"           # your numeric Telegram user id
